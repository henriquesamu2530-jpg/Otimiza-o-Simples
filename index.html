<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <style>
        :root {
            --bg-primary: #0a0d12;
            --bg-card: #121824;
            --bg-card-hover: #1a2334;
            --cyan-accent: #00f2ff;
            --cyan-glow: rgba(0, 242, 255, 0.25);
            --text-main: #f0f4f8;
            --text-dim: #7a8b9e;
            --danger: #ff4757;
            --success: #2ed573;
            --line: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Inter, Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0 12px;
            border-bottom: 1px solid var(--line);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo-svg {

            border: 1px solid var(--cyan-accent);
            border-radius: 12px;
            padding: 6px;
            box-shadow: 0 0 12px var(--cyan-glow);
        }
