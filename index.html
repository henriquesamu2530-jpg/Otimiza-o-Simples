<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIYUH BOOST</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid #334155;
        }

        h1 {
            color: #38bdf8;
            font-size: 1.8rem;
            margin-bottom: 12px;
        }

        p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .btn {
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            width: 100%;
        }

        .btn:hover {
            background-color: #0369a1;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .status {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #4ade80;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>KIYUH BOOST</h1>
        <p>Otimização e desempenho para a sua aplicação Android.</p>
        <button class="btn" onclick="iniciarBoost()">Iniciar Otimização</button>
        <div id="statusMsg" class="status">✓ Sistema otimizado com sucesso!</div>
    </div>

    <script>
        function iniciarBoost() {
            const status = document.getElementById('statusMsg');
            status.style.display = 'block';
            status.textContent = 'A otimizar sistema...';
            status.style.color = '#38bdf8';

            setTimeout(() => {
                status.textContent = '✓ Sistema otimizado com sucesso!';
                status.style.color = '#4ade80';
            }, 1500);
        }
    </script>

</body>
</html>
